[flake8]
ignore=E221,E241,E402,E501,W503,W605,F403,F405
import-order-style=smarkets
strictness=short
docstring_style=sphinx
max-line-length=127
exclude=__init__.py,tools,tests/env/
application-import-names=arb,arb_data_manager,api,avu,cached_data_manager,conftest,util,config,constants,data_access_token,datacite,datarequest,data_object,epic,error,folder,groups,groups_import,json_datacite,json_landing_page,jsonutil,log,mail,measure_coverage,meta,meta_form,metadata_utils,misc,msi,notifications,research,schema,schema_transformation,schema_transformations,settings,stats,pathutil,provenance,policies_datamanager,policies_datapackage_status,policies_datarequest_status,policies_folder_status,policies_retirement_status,policies_intake,policies_utils,pregenerated_data_manager,publication,query,replication,resources,revisions,revision_strategies,revision_utils,rule,sram,user,vault,vault_retire,vault_utils,yoda_names,

[mypy]
exclude = tools|unit-tests
disable_error_code = arg-type, attr-defined, index, method-assign, misc, no-redef, operator, union-attr, unreachable, var-annotated
ignore_missing_imports = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = False
disallow_any_generics = False
disallow_incomplete_defs = True
disallow_untyped_calls = False
disallow_untyped_defs = False
show_error_codes = True
show_error_context = True
